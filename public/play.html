<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B2 + Turso — Playback Test</title>
<style>
  :root {
    --bg-0: #061214;
    --bg-1: #0a1f24;
    --bg-2: #0e2a30;
    --bg-3: #123840;
    --border: #1d4e58;
    --teal: #14f0c8;
    --teal-dim: #0fb39a;
    --teal-glow: rgba(20, 240, 200, 0.55);
    --text: #d8f4ef;
    --text-dim: #7fb3ab;
    --text-faint: #4f7d78;
    --code-bg: #04191c;
    --accent-warn: #ffb347;
    --accent-error: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    background: var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    flex-shrink: 0;
    padding: 10px 14px;
    background: linear-gradient(180deg, var(--bg-3), var(--bg-1));
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 10px;
    box-shadow:
      0 1px 0 rgba(0,0,0,0.9),
      0 8px 16px -2px rgba(0,0,0,0.9),
      0 18px 32px -6px rgba(0,0,0,0.75),
      0 6px 24px -4px rgba(20,240,200,0.22);
  }
  header h1 { font-size: 13px; font-weight: 700; color: var(--teal); text-shadow: 0 0 12px var(--teal-glow); }
  header .sub { font-size: 9px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; }
  main {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 6px;
    background: var(--bg-0);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.9),
      inset 0 8px 20px -6px rgba(0,0,0,0.85),
      inset 0 -2px 4px rgba(0,0,0,0.9),
      inset 0 -8px 20px -6px rgba(0,0,0,0.85),
      inset 1px 0 0 rgba(0,0,0,0.6),
      inset -1px 0 0 rgba(0,0,0,0.6);
  }
  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 14px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--teal-dim) transparent;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb { background: var(--teal-dim); border-radius: 3px; }

  h2 { font-size: 13px; color: var(--teal); margin: 0 0 6px; }
  .lead { color: var(--text-dim); font-size: 11.5px; margin-bottom: 14px; }
  h3 { font-size: 10px; color: var(--teal-dim); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.08em; }

  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: 4px; font-weight: 700;
  }
  .field input {
    width: 100%; font-family: inherit; font-size: 11.5px; padding: 8px 10px;
    border-radius: 5px; border: 1px solid var(--border);
    background: var(--code-bg); color: var(--text); outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input:focus { border-color: var(--teal-dim); box-shadow: 0 0 0 2px rgba(20,240,200,0.15); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn {
    width: 100%; font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 14px; border-radius: 5px; border: 1px solid var(--teal);
    background: var(--teal); color: var(--bg-0); cursor: pointer;
    transition: all 0.18s ease;
    box-shadow: 0 0 10px var(--teal-glow), 0 0 22px -4px var(--teal-glow);
    margin-top: 6px;
  }
  .btn:hover:not(:disabled) { box-shadow: 0 0 14px var(--teal-glow), 0 0 28px -2px var(--teal-glow); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    background: var(--bg-3); border-color: var(--border);
    color: var(--text-faint); cursor: not-allowed; box-shadow: none;
  }

  /* ============================================================
     Links table — single coherent block, no duplicate rules
     ============================================================ */
  .table-wrap {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 8px;
  }

  .links-table {
    width: 100%;
    border-collapse: collapse;
    font-family: inherit;
    font-size: 10.5px;
    color: var(--text-dim);
    table-layout: fixed;
  }

  .links-table thead { background: var(--bg-2); }

  .links-table th {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--teal-dim);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  /* Column widths — one set, no overrides */
  .links-table th.col-sno     { width: 32px; text-align: center; }
  .links-table th.col-cover   { width: 24px; }
  .links-table th.col-likes   { width: 16%; text-align: right; }
  .links-table th.col-size    { width: 21%; text-align: right; }
  .links-table th.col-actions { width: auto; text-align: right; }

  .links-table tbody tr {
    border-bottom: 1px solid var(--border);
  }
  .links-table tbody tr:last-child { border-bottom: none; }
  .links-table tbody tr:hover { background: var(--bg-2); }
  .links-table tbody tr.selected { background: rgba(20,240,200,0.08); }

  .links-table td {
    padding: 6px 6px;
    vertical-align: middle;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .links-table td.col-sno { text-align: center; color: var(--text-faint); }
  .links-table td.col-likes {
    text-align: right;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .links-table td.col-size { text-align: right; color: var(--text-faint); }
  .links-table td.col-actions { text-align: right; white-space: nowrap; }

  .links-table td.col-cover { padding: 4px 6px; }
  .links-table td.col-cover img {
    height: 40px;
    width: auto;
    display: block;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-3);
  }
  .links-table td.col-cover .no-cover {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    border: 1px dashed var(--border);
    background: var(--bg-3);
  }

  .links-table .row-empty { padding: 14px 10px; text-align: center; color: var(--text-faint); }
  .links-table .row-error { padding: 14px 10px; text-align: center; color: var(--accent-error); }

  .action-btn {
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--teal-dim);
    cursor: pointer;
    margin-left: 4px;
    transition: all 0.15s ease;
  }
  .action-btn:hover:not(:disabled) {
    color: var(--teal);
    border-color: var(--teal);
    box-shadow: 0 0 8px -1px var(--teal-glow);
  }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn[data-role="play"] { margin-left: 0; }

  /* ============================================================ */

  .player {
    margin-top: 12px; background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 5px;
    overflow: hidden; display: none;
  }
  .player.active { display: block; }
  .player video { width: 100%; display: block; background: #000; }
  .player .player-meta {
    padding: 6px 10px; font-size: 9.5px; color: var(--text-faint);
    border-top: 1px solid var(--border); word-break: break-all;
  }

  .log {
    margin-top: 16px; background: var(--code-bg);
    border: 1px solid var(--border); border-radius: 5px; overflow: hidden;
  }
  .log .log-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 10px; background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint);
  }
  .log .log-body {
    padding: 10px; font-size: 10.5px; line-height: 1.55;
    color: var(--text-dim); max-height: 200px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
    scrollbar-width: thin; scrollbar-color: var(--teal-dim) transparent;
  }
  .log .line { display: block; margin-bottom: 2px; }
  .log .line.ok   { color: var(--teal); }
  .log .line.err  { color: var(--accent-error); }
  .log .line.info { color: var(--text-dim); }
  .log .line.wait { color: var(--accent-warn); }

  .status {
    display: inline-block; font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 3px;
    border: 1px solid var(--border); background: var(--bg-3);
    color: var(--text-faint); font-weight: 700;
  }
  .status.busy   { color: var(--accent-warn); border-color: var(--accent-warn); }
  .status.done   { color: var(--teal); border-color: var(--teal); background: rgba(20,240,200,0.1); }
  .status.failed { color: var(--accent-error); border-color: var(--accent-error); background: rgba(255,92,92,0.1); }

  footer {
    flex-shrink: 0; padding: 8px 12px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-3));
    border-top: 1px solid var(--border);
    font-size: 9px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.1em;
    display: flex; justify-content: space-between;
    position: relative; z-index: 10;
    box-shadow:
      0 -1px 0 rgba(0,0,0,0.9),
      0 -8px 16px -2px rgba(0,0,0,0.9),
      0 -18px 32px -6px rgba(0,0,0,0.75),
      0 -6px 24px -4px rgba(20,240,200,0.22);
  }
  footer .dot { color: var(--teal); text-shadow: 0 0 8px var(--teal-glow); }
  .page-nav {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .page-link {
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--teal-dim);
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .page-link:hover {
    color: var(--teal);
    border-color: var(--teal);
    box-shadow: 0 0 8px -1px var(--teal-glow);
  }
  .auth-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(6, 18, 20, 0.92);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.auth-overlay.active { display: flex; }
.auth-card {
  width: 100%;
  max-width: 320px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  box-shadow:
    0 1px 0 rgba(0,0,0,0.9),
    0 8px 16px -2px rgba(0,0,0,0.9),
    0 18px 32px -6px rgba(0,0,0,0.75),
    0 0 24px -4px rgba(20,240,200,0.22);
}
.auth-card h2 { font-size: 13px; color: var(--teal); margin: 0 0 6px; }
.auth-card .lead { font-size: 11.5px; color: var(--text-dim); margin: 0 0 12px; }
.auth-error {
  font-size: 10px;
  color: var(--accent-error);
  min-height: 14px;
  margin: 6px 0;
}
</style>
</head>
<body>
<header>
  <h1>B2 + Turso</h1>
  <span class="sub">Playback Test</span>
  <nav class="page-nav">
    <a href="/index.html" class="page-link">Upload</a>
    <a href="/files.html" class="page-link">Files</a>
  </nav>
</header>

<main>
  <div class="content">
    <h2>Play stored URLs</h2>

    <div class="field">
      <label for="playUserId">User ID</label>
      <input type="text" id="playUserId" value="jafernegery" autocomplete="off" spellcheck="false" />
    </div>

    <div class="row">
      <button class="btn" id="playLoadBtn">Load links</button>
      <button class="btn" id="playClearBtn">Clear player</button>
    </div>

    <div class="player" id="player">
      <video id="playerVideo" controls playsinline preload="metadata"></video>
      <div class="player-meta" id="playerMeta"></div>
    </div>

    <h3>download_links_view rows (by likes)</h3>
    <div class="table-wrap">
      <table class="links-table">
        <thead>
          <tr>
            <th class="col-sno">#</th>
            <th class="col-cover">Cover</th>
            <th class="col-likes">Likes</th>
            <th class="col-size">Size</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="play-tbody">
          <tr><td colspan="5" class="row-empty">Not loaded</td></tr>
        </tbody>
      </table>
    </div>

    <h3>Log</h3>
    <div class="log">
      <div class="log-header">
        <span>Activity</span>
        <span class="status" id="playStatus">Idle</span>
      </div>
      <div class="log-body" id="playLog"></div>
    </div>
  </div>
</main>

<footer>
  <span><span class="dot">●</span> B2 + Turso</span>
  <span>Playback test</span>
</footer>

<div id="authOverlay" class="auth-overlay">
<div class="auth-card">
  <h2>API Password</h2>
  <p class="lead">Enter the password to access this page.</p>
  <form id="authForm">
    <div class="field">
      <label for="authPassword">Password</label>
      <input type="password" id="authPassword" autocomplete="current-password" required />
    </div>
    <div class="auth-error" id="authError"></div>
    <button type="submit" class="btn" id="authSubmit">Unlock</button>
  </form>
</div>
</div>

<script>
(() => {
  // ---- API password auth ----
let API_KEY = localStorage.getItem('xapiKey') || '';
const _fetch = window.fetch;
window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url;
  if (!url.includes('/api/')) return _fetch(input, init);
  init = { ...init, headers: { ...(init.headers || {}), 'X-API-Key': API_KEY } };
  const res = await _fetch(input, init);
  if (res.status === 401) showAuthOverlay('Wrong password. Try again.');
  return res;
};

function showAuthOverlay(msg) {
  document.getElementById('authError').textContent = msg || '';
  document.getElementById('authOverlay').classList.add('active');
  setTimeout(() => document.getElementById('authPassword').focus(), 50);
}

document.getElementById('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = document.getElementById('authPassword').value;
  if (!val) return;
  API_KEY = val;
  localStorage.setItem('xapiKey', val);
  document.getElementById('authOverlay').classList.remove('active');
  document.getElementById('authPassword').value = '';
  document.getElementById('authError').textContent = '';
});

if (!API_KEY) showAuthOverlay('');
})();
  (() => {
    const API_BASE = 'https://b2-turso-vercel.vercel.app';

    const playUserId   = document.getElementById('playUserId');
    const playLoadBtn  = document.getElementById('playLoadBtn');
    const playClearBtn = document.getElementById('playClearBtn');
    const playTbody    = document.getElementById('play-tbody');
    const player       = document.getElementById('player');
    const playerVideo  = document.getElementById('playerVideo');
    const playerMeta   = document.getElementById('playerMeta');
    const playLogEl    = document.getElementById('playLog');
    const playStatusEl = document.getElementById('playStatus');

    const setStatus = (text, cls) => {
      playStatusEl.textContent = text;
      playStatusEl.className = `status ${cls || ''}`;
    };
    const log = (msg, kind = 'info') => {
      const line = document.createElement('span');
      line.className = `line ${kind}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      playLogEl.appendChild(line);
      playLogEl.scrollTop = playLogEl.scrollHeight;
    };
    const escHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
    const fmtBytes = (b) => {
      if (!b || b < 0) return '—';
      if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
      return Math.round(b / 1024) + ' KB';
    };
    const fmtNum = (n) => Number(n || 0).toLocaleString();

    function clearPlayer() {
      playerVideo.pause();
      playerVideo.removeAttribute('src');
      playerVideo.removeAttribute('poster');
      playerVideo.load();
      player.classList.remove('active');
      playerMeta.textContent = '';
    }

    playerVideo.addEventListener('loadedmetadata', () => {
      const d = playerVideo.duration;
      log(`loadedmetadata: duration=${Number.isFinite(d) ? d.toFixed(2) : '?'}s, ${playerVideo.videoWidth}x${playerVideo.videoHeight}`, 'ok');
      setStatus('Playing', 'done');
    });
    playerVideo.addEventListener('error', () => {
      const err = playerVideo.error;
      const code = err ? err.code : '?';
      const msg  = err && err.message ? err.message : '';
      log(`video error: code=${code} ${msg ? '· ' + msg : ''}`, 'err');
      setStatus('Playback failed', 'failed');
    });
    playerVideo.addEventListener('waiting', () => log('buffering…', 'info'));
    playerVideo.addEventListener('playing', () => log('playing', 'ok'));
    playerVideo.addEventListener('stalled', () => log('stalled (network?)', 'wait'));

    playLoadBtn.addEventListener('click', async () => {
      const userId = playUserId.value.trim();
      playLoadBtn.disabled = true;
      setStatus('Loading', 'busy');
      playTbody.innerHTML = '<tr><td colspan="5" class="row-empty">Loading…</td></tr>';
      log(`GET ${API_BASE}/api/download-links-view?userId=${userId || '(default)'}`, 'info');

      try {
        const params = new URLSearchParams();
        if (userId) params.set('userId', userId);
        const res = await fetch(`${API_BASE}/api/download-links-view?${params}`);
        const data = await res.json().catch(() => ({ success: false, error: `HTTP ${res.status}` }));
        if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);

        const items = data.items || [];
        if (items.length === 0) {
          playTbody.innerHTML = '<tr><td colspan="5" class="row-empty">No rows in download_links_view.</td></tr>';
          setStatus('Empty', 'done');
          log('No rows to play. Run Sync in the Links tab first.', 'info');
          return;
        }

        playTbody.innerHTML = items.map((it, i) => {
          const user = it.userId || '';
          const vidname = user ? `${user}_${it.videoKey}` : it.videoKey;
          const imgname = it.coverKey
            ? (user ? `${user}_${it.coverKey}` : it.coverKey)
            : '';

          return `
          <tr
            data-idx="${i}"
            data-url="${escHtml(it.videoUrl || '')}"
            data-cover="${escHtml(it.coverUrl || '')}"
            data-key="${escHtml(it.videoKey)}"
            data-user="${escHtml(user)}"
            data-vidname="${escHtml(vidname)}"
            data-imgname="${escHtml(imgname)}"
          >
            <td class="col-sno">${i + 1}</td>
            <td class="col-cover">
              ${it.coverUrl
                ? `<img src="${escHtml(it.coverUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
                : `<div class="no-cover"></div>`}
            </td>
            <td class="col-likes">${fmtNum(it.likes)}</td>
            <td class="col-size">${fmtBytes(it.fileSize)}</td>
            <td class="col-actions">
              <button class="action-btn" data-role="play" ${it.videoUrl ? '' : 'disabled'}>Play</button>
              <button class="action-btn" data-role="download" ${it.videoUrl ? '' : 'disabled'}>Download</button>
            </td>
          </tr>
          `;
        }).join('');

        playTbody.querySelectorAll('button[data-role="play"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tr = btn.closest('tr');
            const url = tr.getAttribute('data-url');
            const cover = tr.getAttribute('data-cover');
            const key = tr.getAttribute('data-key');
            const user = tr.getAttribute('data-user');
            const vidname = tr.getAttribute('data-vidname');
            if (!url) return log('No URL on this row.', 'err');

            playTbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
            tr.classList.add('selected');

            log(`Playing ${vidname || key} (user=${user || '?'})`, 'info');
            log(`URL: ${url.slice(0, 100)}…`, 'info');
            if (cover) log(`Poster: ${cover.slice(0, 100)}…`, 'info');
            else log('No cover URL on this row.', 'wait');
            setStatus('Loading video', 'busy');

            player.classList.add('active');
            if (cover) playerVideo.setAttribute('poster', cover);
            else playerVideo.removeAttribute('poster');
            playerVideo.src = url;
            playerVideo.load();
            playerMeta.textContent = `${vidname || key} · ${url.slice(0, 120)}…`;

            playerVideo.play().catch(err => {
              log(`play() rejected: ${err.message}`, 'err');
              setStatus('Playback failed', 'failed');
            });
          });
        });

        playTbody.querySelectorAll('button[data-role="download"]').forEach(btn => {
  btn.addEventListener('click', () => {
    const tr = btn.closest('tr');
    const url = tr.getAttribute('data-url');
    const vidname = tr.getAttribute('data-vidname') || tr.getAttribute('data-key') || 'video.mp4';
    if (!url) return;
    
    const a = document.createElement('a');
    a.href = url;
    a.download = vidname;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1000);
  });
});

        setStatus(`Loaded ${items.length}`, 'done');
        log(`Loaded ${items.length} row(s) from download_links_view (sorted by likes).`, 'ok');
      } catch (err) {
        playTbody.innerHTML = `<tr><td colspan="5" class="row-error">Failed: ${escHtml(err.message)}</td></tr>`;
        setStatus('Failed', 'failed');
        log(`Load failed: ${err.message}`, 'err');
      } finally {
        playLoadBtn.disabled = false;
      }
    });

    playClearBtn.addEventListener('click', () => {
      clearPlayer();
      playTbody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
      setStatus('Cleared', 'done');
      log('Player cleared.', 'info');
    });
  })();
</script>

</body>
</html>
