<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B2 + Turso — Local Files</title>
<style>
  :root {
    --bg-0: #061214;
    --bg-1: #0a1f24;
    --bg-2: #0e2a30;
    --bg-3: #123840;
    --border: #1d4e58;
    --teal: #14f0c8;
    --teal-dim: #0fb39a;
    --teal-glow: rgba(20, 240, 200, 0.55);
    --text: #d8f4ef;
    --text-dim: #7fb3ab;
    --text-faint: #4f7d78;
    --code-bg: #04191c;
    --accent-warn: #ffb347;
    --accent-error: #ff5c5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
    background: var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    flex-shrink: 0;
    padding: 10px 14px;
    background: linear-gradient(180deg, var(--bg-3), var(--bg-1));
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 10px;
    box-shadow:
      0 1px 0 rgba(0, 0, 0, 0.9),
      0 8px 16px -2px rgba(0, 0, 0, 0.9),
      0 18px 32px -6px rgba(0, 0, 0, 0.75),
      0 6px 24px -4px rgba(20, 240, 200, 0.22);
  }
  header h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--teal);
    text-shadow: 0 0 12px var(--teal-glow);
  }
  header .sub {
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  main {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    padding: 6px;
    background: var(--bg-0);
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.9),
      inset 0 8px 20px -6px rgba(0, 0, 0, 0.85),
      inset 0 -2px 4px rgba(0, 0, 0, 0.9),
      inset 0 -8px 20px -6px rgba(0, 0, 0, 0.85),
      inset 1px 0 0 rgba(0, 0, 0, 0.6),
      inset -1px 0 0 rgba(0, 0, 0, 0.6);
  }

  .content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px 14px 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--teal-dim) transparent;
  }
  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-thumb {
    background: var(--teal-dim);
    border-radius: 3px;
  }

  h2 {
    font-size: 13px;
    color: var(--teal);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .lead {
    color: var(--text-dim);
    font-size: 11.5px;
    margin-bottom: 14px;
  }
  h3 {
    font-size: 10px;
    color: var(--teal-dim);
    margin: 14px 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .field input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 11.5px;
    padding: 8px 10px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input[type="text"]:focus {
    border-color: var(--teal-dim);
    box-shadow: 0 0 0 2px rgba(20, 240, 200, 0.15);
  }
  .field .hint {
    font-size: 9.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 20px 12px;
    background: var(--code-bg);
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }
  .dropzone:hover,
  .dropzone.dragover {
    border-color: var(--teal-dim);
    background: var(--bg-2);
    box-shadow: 0 0 0 2px rgba(20, 240, 200, 0.1);
  }
  .dropzone .dz-icon {
    font-size: 20px;
    color: var(--teal-dim);
    margin-bottom: 4px;
  }
  .dropzone .dz-text {
    font-size: 11px;
    color: var(--text-dim);
  }
  .dropzone .dz-hint {
    font-size: 9.5px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .dropzone input[type="file"] { display: none; }

  .btn {
    width: 100%;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-radius: 5px;
    border: 1px solid var(--teal);
    background: var(--teal);
    color: var(--bg-0);
    cursor: pointer;
    transition: all 0.18s ease;
    box-shadow:
      0 0 10px var(--teal-glow),
      0 0 22px -4px var(--teal-glow);
    margin-top: 6px;
  }
  .btn:hover:not(:disabled) {
    box-shadow:
      0 0 14px var(--teal-glow),
      0 0 28px -2px var(--teal-glow);
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled {
    background: var(--bg-3);
    border-color: var(--border);
    color: var(--text-faint);
    cursor: not-allowed;
    box-shadow: none;
  }

  .file-list {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10.5px;
    color: var(--text-dim);
  }
  .file-item .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item .size {
    color: var(--text-faint);
    margin-left: 8px;
    font-size: 10px;
  }
  .file-item .remove {
    margin-left: 8px;
    color: var(--accent-error);
    cursor: pointer;
    font-weight: 700;
    padding: 0 4px;
  }

  .log {
    margin-top: 16px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .log .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
  }
  .log .log-body {
    padding: 10px;
    font-size: 10.5px;
    line-height: 1.55;
    color: var(--text-dim);
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    scrollbar-width: thin;
    scrollbar-color: var(--teal-dim) transparent;
  }
  .log .line { display: block; margin-bottom: 2px; }
  .log .line.ok   { color: var(--teal); }
  .log .line.err  { color: var(--accent-error); }
  .log .line.info { color: var(--text-dim); }
  .log .line.wait { color: var(--accent-warn); }

  .status {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--text-faint);
    font-weight: 700;
  }
  .status.ready  { color: var(--teal-dim); border-color: var(--teal-dim); }
  .status.busy   { color: var(--accent-warn); border-color: var(--accent-warn); }
  .status.done   { color: var(--teal); border-color: var(--teal); background: rgba(20, 240, 200, 0.1); }
  .status.failed { color: var(--accent-error); border-color: var(--accent-error); background: rgba(255, 92, 92, 0.1); }

  footer {
    flex-shrink: 0;
    padding: 8px 12px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-3));
    border-top: 1px solid var(--border);
    font-size: 9px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
    position: relative;
    z-index: 10;
    box-shadow:
      0 -1px 0 rgba(0, 0, 0, 0.9),
      0 -8px 16px -2px rgba(0, 0, 0, 0.9),
      0 -18px 32px -6px rgba(0, 0, 0, 0.75),
      0 -6px 24px -4px rgba(20, 240, 200, 0.22);
  }
  footer .dot { color: var(--teal); text-shadow: 0 0 8px var(--teal-glow); }
.table-wrap {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 8px;
  }
  .files-table {
    width: 100%;
    border-collapse: collapse;
    font-family: inherit;
    font-size: 10.5px;
    color: var(--text-dim);
    table-layout: fixed;
  }
  .files-table thead { background: var(--bg-2); }
  .files-table th {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--teal-dim);
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .files-table th.col-size { width: 76px; text-align: right; }
  .files-table th.col-date { width: 92px; }
  .files-table th.col-actions { width: 110px; }
  .files-table tbody tr {
    border-bottom: 1px solid var(--border);
  }
  .files-table tbody tr:last-child { border-bottom: none; }
  .files-table tbody tr:hover { background: var(--bg-2); }
  .files-table td {
    padding: 6px 8px;
    vertical-align: middle;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .files-table td.col-name { color: var(--text); font-size: 10.5px; }
  .files-table td.col-size {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-faint);
  }
  .files-table td.col-date { color: var(--text-faint); font-size: 10px; }
  .files-table td.col-actions {
    text-align: right;
  }
  .files-table .row-empty,
  .files-table .row-error {
    padding: 14px 10px;
    text-align: center;
    color: var(--text-faint);
  }
  .files-table .row-error { color: var(--accent-error); }

  .action-btn {
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--teal-dim);
    cursor: pointer;
    margin-left: 4px;
    transition: all 0.15s ease;
  }
  .action-btn:hover:not(:disabled) {
    color: var(--teal);
    border-color: var(--teal);
    box-shadow: 0 0 8px -1px var(--teal-glow);
  }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn.danger:hover:not(:disabled) {
    color: var(--accent-error);
    border-color: var(--accent-error);
  }
  .page-nav {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .page-link {
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--teal-dim);
    text-decoration: none;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .page-link:hover {
    color: var(--teal);
    border-color: var(--teal);
    box-shadow: 0 0 8px -1px var(--teal-glow);
  }
</style>
</head>
<body>

<header>
  <h1>B2 + Turso</h1>
  <span class="sub">Local files</span>
  <nav class="page-nav">
    <a href="/" class="page-link">Upload</a>
    <a href="/play" class="page-link">Play</a>
  </nav>
</header>

<main>
  <div class="content">
    <h2>Upload local files</h2>
    <p class="lead">Pick one or more files. Each is streamed to B2 and its metadata is written to Turso.</p>

    <div class="field">
      <label for="filesUserId">User ID</label>
      <input type="text" id="filesUserId" value="jafernegery" autocomplete="off" spellcheck="false" />
    </div>

    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple />
      <div class="dz-icon">⤒</div>
      <div class="dz-text">Drop files here or click to pick</div>
      <div class="dz-hint">Up to 300 MB per file</div>
    </div>

    <div class="file-list" id="fileList"></div>

    <button class="btn" id="uploadBtn" disabled>Upload</button>

<h3>Your files</h3>
    <div class="row" style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;">
      <div class="field" style="margin-bottom:0;">
        <label for="listUserId">User ID</label>
        <input type="text" id="listUserId" value="jafernegery" autocomplete="off" spellcheck="false" />
      </div>
      <button class="btn" id="listBtn" style="margin-top:0;width:auto;padding-left:18px;padding-right:18px;">Load</button>
    </div>

    <div class="table-wrap">
      <table class="files-table">
        <thead>
          <tr>
            <th>Name</th>
            <th class="col-size">Size</th>
            <th class="col-date">Modified</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="files-tbody">
          <tr><td colspan="4" class="row-empty">Not loaded</td></tr>
        </tbody>
      </table>
    </div>
    <h3>Log</h3>
    <div class="log">
      <div class="log-header">
        <span>Activity</span>
        <span class="status" id="filesStatus">Idle</span>
      </div>
      <div class="log-body" id="filesLog"></div>
    </div>
  </div>
</main>

<footer>
  <span><span class="dot">●</span> B2 + Turso</span>
  <span>Local → B2 → Turso</span>
</footer>

<script type="module">
  const API_BASE = 'https://b2-turso-vercel.vercel.app';
  const MAX_BYTES = 300 * 1024 * 1024;

  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const fileListEl = document.getElementById('fileList');
  const uploadBtn = document.getElementById('uploadBtn');
  const filesLogEl = document.getElementById('filesLog');
  const filesStatusEl = document.getElementById('filesStatus');
  const filesUserId = document.getElementById('filesUserId');

  const listBtn = document.getElementById('listBtn');
  const listUserId = document.getElementById('listUserId');
  const filesTbody = document.getElementById('files-tbody');

  let selected = [];

  const setStatus = (text, cls) => {
    filesStatusEl.textContent = text;
    filesStatusEl.className = `status ${cls || ''}`;
  };
  const log = (msg, kind = 'info') => {
    const line = document.createElement('span');
    line.className = `line ${kind}`;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    filesLogEl.appendChild(line);
    filesLogEl.scrollTop = filesLogEl.scrollHeight;
  };
  const fmtBytes = (b) => {
    if (!b || b < 0) return '0 B';
    if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
    if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
    if (b >= 1024) return Math.round(b / 1024) + ' KB';
    return b + ' B';
  };
  const escHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  // ---------- Upload ----------
  function renderList() {
    if (selected.length === 0) {
      fileListEl.innerHTML = '';
      uploadBtn.disabled = true;
      return;
    }
    fileListEl.innerHTML = selected.map((f, i) => `
      <div class="file-item" data-idx="${i}">
        <span class="name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
        <span class="size">${fmtBytes(f.size)}</span>
        <span class="remove" title="Remove">×</span>
      </div>
    `).join('');
    fileListEl.querySelectorAll('.remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.closest('.file-item').dataset.idx);
        selected.splice(idx, 1);
        renderList();
      });
    });
    uploadBtn.disabled = selected.length === 0;
  }

  function addFiles(files) {
    for (const f of files) {
      if (f.size > MAX_BYTES) {
        log(`Skipped ${f.name} (${fmtBytes(f.size)} > 300 MB)`, 'err');
        continue;
      }
      if (selected.some(s => s.name === f.name && s.size === f.size && s.lastModified === f.lastModified)) {
        continue;
      }
      selected.push(f);
    }
    renderList();
  }

  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter', 'dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    if (e.dataTransfer?.files) addFiles(e.dataTransfer.files);
  });

  async function uploadOne(file, userId) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('userId', userId);
    fd.append('dateModified', new Date(file.lastModified).toISOString());

    const res = await fetch(`${API_BASE}/api/files/upload`, {
      method: 'POST',
      body: fd,
    });
    const data = await res.json().catch(() => ({ success: false, error: `HTTP ${res.status}` }));
    if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  uploadBtn.addEventListener('click', async () => {
    const userId = filesUserId.value.trim() || 'user_123';
    const files = [...selected];
    if (files.length === 0) return;

    uploadBtn.disabled = true;
    setStatus(`Uploading 0/${files.length}`, 'busy');
    log(`Starting ${files.length} upload(s) for user=${userId}`, 'info');

    let ok = 0, fail = 0;

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      log(`[${i + 1}/${files.length}] ${f.name} (${fmtBytes(f.size)})`, 'info');
      try {
        const data = await uploadOne(f, userId);
        ok++;
        log(`  → ${data.fileKey}`, 'ok');
        selected = selected.filter(s => !(s.name === f.name && s.size === f.size && s.lastModified === f.lastModified));
        renderList();
      } catch (err) {
        fail++;
        log(`  → Failed: ${err.message}`, 'err');
      }
      setStatus(`${ok}/${files.length} done`, fail ? 'failed' : 'busy');
    }

    setStatus(`Done ${ok} ok · ${fail} fail`, fail ? 'failed' : 'done');
    log(`Finished. ${ok} ok, ${fail} failed.`, fail ? 'err' : 'ok');
    uploadBtn.disabled = selected.length === 0;

    // Auto-reload the list after a successful batch
    if (ok > 0 && listUserId.value.trim() === userId) {
      await loadList();
    }
  });

  // ---------- List + Download ----------
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }
  }

  async function signAndDownload(fileKey, userId, originalName) {
    const params = new URLSearchParams({ fileKey });
    if (userId) params.set('userId', userId);

    const res = await fetch(`${API_BASE}/api/files/download?${params}`);
    const data = await res.json().catch(() => ({ success: false, error: `HTTP ${res.status}` }));
    if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);

    const a = document.createElement('a');
    a.href = data.downloadUrl;
    a.download = originalName || data.originalName || '';
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1000);

    return data;
  }

  async function loadList() {
    const userId = listUserId.value.trim() || 'user_123';
    listBtn.disabled = true;
    setStatus('Loading', 'busy');
    filesTbody.innerHTML = '<tr><td colspan="4" class="row-empty">Loading…</td></tr>';
    log(`GET ${API_BASE}/api/files/list?userId=${userId}`, 'info');

    try {
      const res = await fetch(`${API_BASE}/api/files/list?userId=${encodeURIComponent(userId)}`);
      const data = await res.json().catch(() => ({ success: false, error: `HTTP ${res.status}` }));
      if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);

      const items = data.items || [];
      if (items.length === 0) {
        filesTbody.innerHTML = '<tr><td colspan="4" class="row-empty">No files.</td></tr>';
        setStatus('Empty', 'ready');
        log('No files.', 'info');
        return;
      }

      filesTbody.innerHTML = items.map((it, i) => `
        <tr
          data-key="${escHtml(it.fileKey)}"
          data-name="${escHtml(it.originalName)}"
        >
          <td class="col-name" title="${escHtml(it.originalName)}">${escHtml(it.originalName)}</td>
          <td class="col-size">${fmtBytes(it.fileSize)}</td>
          <td class="col-date">${escHtml((it.dateModified || '').slice(0, 10))}</td>
          <td class="col-actions">
            <button class="action-btn" data-role="copy">Copy</button>
            <button class="action-btn" data-role="download">Download</button>
          </td>
        </tr>
      `).join('');

      filesTbody.querySelectorAll('button[data-role="copy"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tr = btn.closest('tr');
          const fileKey = tr.getAttribute('data-key');
          try {
            const params = new URLSearchParams({ fileKey, userId });
            const res = await fetch(`${API_BASE}/api/files/download?${params}`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
            const ok = await copyText(data.downloadUrl);
            log(ok ? `Copied URL for ${fileKey}` : 'Copy failed', ok ? 'ok' : 'err');
          } catch (err) {
            log(`Copy failed: ${err.message}`, 'err');
          }
        });
      });

      filesTbody.querySelectorAll('button[data-role="download"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tr = btn.closest('tr');
          const fileKey = tr.getAttribute('data-key');
          const originalName = tr.getAttribute('data-name');
          btn.disabled = true;
          try {
            await signAndDownload(fileKey, userId, originalName);
            log(`Download triggered for ${fileKey}`, 'ok');
          } catch (err) {
            log(`Download failed: ${err.message}`, 'err');
          } finally {
            btn.disabled = false;
          }
        });
      });

      setStatus(`Loaded ${items.length}`, 'done');
      log(`Loaded ${items.length} file(s).`, 'ok');
    } catch (err) {
      filesTbody.innerHTML = `<tr><td colspan="4" class="row-error">Failed: ${escHtml(err.message)}</td></tr>`;
      setStatus('Failed', 'failed');
      log(`List failed: ${err.message}`, 'err');
    } finally {
      listBtn.disabled = false;
    }
  }

  listBtn.addEventListener('click', loadList);
</script>

</body>
</html>
